<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Babylon Engine Trial</title>
<style>
  :root { --bg: #1a1410; --ink: #fff4e6; --dim: rgba(255, 244, 230, 0.7); --accent: #5ac8fa; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; overflow: hidden; }
  #game { width: 100%; height: 100%; display: block; outline: none; touch-action: none; }
  #hud { position: fixed; left: 12px; top: 10px; padding: 4px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); font-size: 12px; pointer-events: none; }
  #keys { position: fixed; right: 12px; bottom: 10px; padding: 6px 10px; border-radius: 6px; background: rgba(0, 0, 0, 0.45); font-size: 12px; color: var(--dim); pointer-events: none; max-width: calc(100% - 40px); }
  #start { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20, 14, 10, 0.72); cursor: pointer; text-align: center; padding: 16px; }
  #start h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: 0.04em; }
  #start p { margin: 4px 0; color: var(--dim); }
  #start b { color: var(--accent); }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="hud">Loading Babylon.js…</div>
<div id="keys">A/D move · Space jump · Shift dash · J melee · K fire · L parry · mouse aim · ` inspector</div>
<div id="start"><div>
  <h1>Engine trial: Babylon.js</h1>
  <p>Nova in the Helix Foundry, drawn by Babylon.js. The simulation is the prototype's own, unchanged.</p>
  <p><b>Click, press a key or press A on a controller</b> to start.</p>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/babylonjs@9.29.0/babylon.js"></script>
<script type="module" src="./main.js"></script>
</body>
</html>
