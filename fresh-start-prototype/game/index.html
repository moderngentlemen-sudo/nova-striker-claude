<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=IBM+Plex+Mono&family=Saira+Condensed:wght@600;700;800&display=swap">
<style>
/* Layout: one full-bleed game canvas; translucent HUD plates in the corners; menus as centered cards. */
:root {
  --ground: #0b1322;
  --plate: rgba(10, 18, 34, 0.74);
  --plate-edge: rgba(236, 244, 255, 0.16);
  --text: #f3f7fc;
  --muted: #a8b7ca;
  --warm: #ffb547;
  --hostile: #ff2e7e;
  --sky: #cfe7f6;
  --font-display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Barlow', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ground); color: var(--text); font-family: var(--font-body); overflow: hidden; }
#app { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--sky); }
#game { display: block; width: 100%; height: 100%; outline: none; }
#overlay { position: absolute; inset: 0; pointer-events: none; font-size: 15px; }
kbd { font-family: var(--font-mono); font-size: 12px; padding: 1px 6px; border-radius: 4px; background: rgba(255,255,255,0.1); border: 1px solid var(--plate-edge); color: var(--text); }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; pointer-events: auto;
  background: linear-gradient(160deg, rgba(8, 16, 32, 0.62), rgba(8, 16, 32, 0.36)); backdrop-filter: blur(5px); }
.card { width: 100%; max-width: 760px; max-height: calc(100% - 8px); max-height: calc(100vh - 90px);   /* content height: leaves room for the padding */ overflow: auto; background: var(--plate);
  border: 1px solid var(--plate-edge); border-radius: 12px; padding: 24px 28px; box-shadow: 0 24px 70px rgba(2, 8, 20, 0.45); }
.card.wide { max-width: 940px; }
@media (max-height: 760px) { .card { padding-top: 18px; padding-bottom: 18px; max-height: calc(100vh - 70px); } .fine { margin-top: 10px; } }
.eyebrow { margin: 0; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.16em; font-size: 13px; color: var(--warm); }
h1, h2 { font-family: var(--font-display); text-transform: uppercase; text-wrap: balance; margin: 6px 0 10px; }
h1 { font-weight: 800; font-size: clamp(44px, 8vw, 84px); line-height: 0.9; letter-spacing: 0.01em; transform: skewX(-9deg); transform-origin: left; }
h1::after { content: ''; display: block; width: 3.2em; height: 6px; margin-top: 8px; background: linear-gradient(90deg, var(--warm), #ff8a1f); }
h2 { font-weight: 700; font-size: 30px; }
h3 { margin: 0 0 6px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; font-size: 15px; color: var(--muted); }
.lede { color: var(--muted); max-width: 60ch; margin: 0 0 16px; line-height: 1.45; }
.join { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 20px; margin: 4px 0 18px; }
.pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--warm); box-shadow: 0 0 0 0 rgba(255, 181, 71, 0.6); animation: pulse 1.4s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 12px rgba(255, 181, 71, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 181, 71, 0); } }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }
.cols ul { margin: 0; padding-left: 18px; line-height: 1.8; color: var(--text); }
.fine { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 14px 0 0; max-width: 75ch; }
.notice { color: var(--warm); }
.touchnote { display: none; color: var(--warm); }
@media (pointer: coarse) and (hover: none) { .touchnote { display: block; } }

.actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 16px; }
.btn { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: 15px; color: var(--text);
  background: rgba(255, 255, 255, 0.08); border: 1px solid var(--plate-edge); border-radius: 6px; padding: 8px 14px; cursor: pointer; }
.btn:hover { background: rgba(255, 255, 255, 0.16); }
.btn:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--warm); outline-offset: 2px; }
/* Controller navigation of the pause menu: a clear ring on the focused control, and its settings row lit */
.padnav .btn:focus, .padnav select:focus, .padnav input:focus { outline: 3px solid var(--warm); outline-offset: 2px; }
.padnav .setting:focus-within { background: rgba(255, 190, 90, 0.14); box-shadow: inset 0 0 0 1px rgba(255, 190, 90, 0.45); }
.btn.small { font-size: 13px; padding: 5px 10px; }
.btn.on { background: var(--warm); color: #1d1204; border-color: var(--warm); }
.btn.ghost { background: transparent; }
.players { display: grid; gap: 6px; margin-bottom: 16px; }
.prow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.pmark { min-width: 220px; color: var(--muted); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 18px; }
.setting { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 6px; background: rgba(255,255,255,0.04); }
.setting span { min-width: 0; color: var(--text); font-size: 14px; }
.setting .val { font-variant-numeric: tabular-nums; opacity: 0.75; white-space: nowrap; }
select, input[type=range] { max-width: 50%; }
select { font: inherit; font-size: 13px; color: var(--text); background: #16233a; border: 1px solid var(--plate-edge); border-radius: 5px; padding: 4px 6px; }
input[type=checkbox] { width: 18px; height: 18px; accent-color: var(--warm); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--plate-edge); }
th { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); font-weight: 700; }
.help .card { overflow-x: auto; }

.hud .panel { position: absolute; width: min(250px, 42vw); padding: 7px 12px 9px; background: var(--plate); border-left: 4px solid var(--pc);
  border-radius: 4px; transform: skewX(-8deg); box-shadow: 0 8px 24px rgba(2, 8, 20, 0.25); }
.hud .panel > * { transform: skewX(8deg); }
.hud .p0 { left: 16px; top: 16px; } .hud .p1 { right: 16px; top: 16px; }
.hud .p2 { left: 16px; bottom: 16px; } .hud .p3 { right: 16px; bottom: 16px; }
.ptop { display: flex; align-items: baseline; gap: 8px; font-family: var(--font-display); text-transform: uppercase; }
.ptop .mark { color: var(--pc); font-weight: 800; font-size: 15px; }
.ptop .name { font-weight: 800; font-size: 20px; letter-spacing: 0.03em; }
.ptop .role { color: var(--muted); font-weight: 600; font-size: 13px; letter-spacing: 0.1em; margin-left: auto; }
.bar { position: relative; height: 9px; margin: 4px 0 6px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width 0.12s linear; }
.bar .strain { background: rgba(255, 255, 255, 0.35); }
.bar .fill { background: linear-gradient(90deg, #ffffff, #ffe7b5); }
.sub { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; min-height: 20px; font-size: 12px; }
.chip { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; padding: 1px 7px; border-radius: 3px; background: rgba(255,255,255,0.1); color: var(--muted); }
.chip.ready { background: rgba(255, 181, 71, 0.2); color: var(--warm); }
.chip.vb { background: var(--warm); color: #1d1204; }
.chip.tether { background: rgba(255, 154, 31, 0.16); color: #ffc27a; }
.chip.veil { background: rgba(220, 236, 255, 0.14); color: #dcecff; }
.chip.veil.on { background: #dcecff; color: #14202e; }
.chip.flare { background: #ff9a1f; color: #1d1204; }
.chip.perfect { background: #fff1c9; color: #1d1204; }
.chip.focus.on { color: var(--warm); }
.res.fuel { width: 44px; }
.res.fuel i { background: linear-gradient(90deg, #ffb547, #fff1c9); }
.res { display: inline-block; width: 64px; height: 6px; background: rgba(255,255,255,0.14); border-radius: 2px; overflow: hidden; }
.res i { display: block; height: 100%; background: linear-gradient(90deg, #ff9a1f, #ffd08a); }
.res.aegis { width: 48px; } .res.aegis i { background: linear-gradient(90deg, #ffd889, #fff6e0); }
.res.over { width: 40px; } .res.over i { background: linear-gradient(90deg, #fff1c9, #ffffff); }
.chip.over { background: #fff6e0; color: #1d1204; animation: overPulse 0.5s ease-in-out infinite alternate; }
.chip.red { background: #ff2414; color: #ffffff; }
/* Version 10: RAM's Integrity and Kinetic, Fix's Scrap, and the boosts anyone can carry (Plating, Overclock) */
.res.integ { width: 56px; } .res.integ i { background: linear-gradient(90deg, #3d86e0, #bfe0ff); } .res.integ.broken i { background: #ff5a6e; }
.res.scrap { width: 50px; } .res.scrap i { background: linear-gradient(90deg, #e0a81e, #ffe27a); }
.chip.ram { background: rgba(88, 166, 255, 0.2); color: #bfe0ff; }
.chip.kin { color: #8fb8e8; } .chip.kin.on { background: #58a6ff; color: #071426; }
.chip.fix { background: rgba(60, 240, 176, 0.14); color: #9ff5d0; } .chip.fix.on { background: #3cf0b0; color: #062018; }
.chip.plate { background: rgba(169, 200, 255, 0.2); color: #d6e6ff; box-shadow: inset 0 0 0 1px rgba(169, 200, 255, 0.6); }
.chip.over2 { background: rgba(111, 227, 255, 0.2); color: #c8f4ff; }
.chip.fury { background: rgba(255, 90, 74, 0.24); color: #ffc2b8; }
.bar .plating { left: auto !important; right: 0; background: repeating-linear-gradient(90deg, rgba(169, 200, 255, 0.95) 0 5px, rgba(214, 230, 255, 0.95) 5px 7px); }
.help tbody th { padding-top: 14px; color: #e8f0fa; font-size: 13px; }
/* Ultimate bar: a thin cyan-white line under the health bar; full, it glows and says how to fire it */
.ultbar { position: relative; height: 5px; margin: -3px 0 6px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; }
.ultbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 2px; background: linear-gradient(90deg, #3fb8ff, #bff4ff); transition: width 0.15s linear; }
.ultbar b { position: absolute; right: 0; top: 7px; font-family: var(--font-display); font-weight: 800; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #bff4ff; line-height: 1; }
.panel.ultready .ultbar i { background: linear-gradient(90deg, #7fe3ff, #ffffff); animation: ultGlow 0.55s ease-in-out infinite alternate; }
.panel.ultready .sub { margin-top: 12px; }
@keyframes ultGlow { from { box-shadow: 0 0 2px 0 rgba(127, 227, 255, 0.4); } to { box-shadow: 0 0 10px 2px rgba(191, 244, 255, 0.95); } }
/* The ultimate: letterbox bars, the name across the screen during the call, then small at the top */
.ultcast { position: absolute; inset: 0; pointer-events: none; }
.ultcast .lb { position: absolute; left: 0; right: 0; height: 7vh; background: #03060c; transition: transform 0.22s ease-out; }
.ultcast .lb.top { top: 0; transform: translateY(-101%); } .ultcast .lb.bot { bottom: 0; transform: translateY(101%); }
.ultcast.on .lb { transform: none; }
.ultcast .uname { position: absolute; left: 50%; top: 34%; transform: translate(-50%, -50%) skewX(-8deg); text-align: center; opacity: 0; white-space: nowrap; }
.ultcast .uname small { display: block; font-family: var(--font-display); font-weight: 700; font-size: 16px; letter-spacing: 0.32em; text-transform: uppercase; color: #7fe3ff; }
.ultcast .uname strong { display: block; font-family: var(--font-display); font-weight: 800; font-size: clamp(40px, 8vw, 104px); line-height: 0.95; letter-spacing: 0.05em; text-transform: uppercase;
  color: #ffffff; text-shadow: 0 0 18px rgba(127, 227, 255, 0.95), 0 0 46px rgba(63, 184, 255, 0.6); }
.ultcast.cast .uname { opacity: 1; animation: ultIn 0.35s cubic-bezier(0.2, 1.4, 0.4, 1); }
.ultcast.run .uname, .ultcast.finish .uname { opacity: 1; top: calc(7vh + 10px); transform: translate(-50%, 0) skewX(-8deg) scale(0.42); transform-origin: 50% 0; transition: top 0.25s, transform 0.25s; }
.ultcast.finish.team .uname { top: 34%; transform: translate(-50%, -50%) skewX(-8deg) scale(1.05); }
.ultcast .ujoin { position: absolute; left: 50%; bottom: calc(7vh + 18px); transform: translateX(-50%); display: flex; gap: 10px; }
.ultcast .ujoin span { padding: 6px 14px; border-radius: 4px; background: rgba(3, 6, 12, 0.85); border-left: 4px solid var(--pc); font-family: var(--font-display); font-weight: 800;
  font-size: 18px; letter-spacing: 0.06em; text-transform: uppercase; color: #ffffff; animation: joinPulse 0.4s ease-in-out infinite alternate; }
@keyframes ultIn { from { transform: translate(-50%, -50%) skewX(-8deg) scale(1.8); opacity: 0; letter-spacing: 0.4em; } to { transform: translate(-50%, -50%) skewX(-8deg) scale(1); opacity: 1; } }
@keyframes joinPulse { from { box-shadow: 0 0 0 0 rgba(127, 227, 255, 0); } to { box-shadow: 0 0 14px 2px rgba(127, 227, 255, 0.7); } }
@media (prefers-reduced-motion: reduce) { .panel.ultready .ultbar i, .ultcast .ujoin span { animation: none; } .ultcast.cast .uname { animation: none; } }
.closehint b { color: var(--text); }
.helphead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.closebadge { margin: 4px 0 0; padding: 7px 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.08); border: 1px solid var(--plate-edge); font-family: var(--font-display);
  font-weight: 700; font-size: 16px; letter-spacing: 0.04em; text-transform: uppercase; text-align: right; }
.closebadge b { display: inline-block; min-width: 1.4em; padding: 0 5px; margin: 0 2px; border-radius: 4px; background: var(--warm); color: #1d1204; text-align: center; }
.closebadge span { display: block; margin-top: 3px; font-family: var(--font-body); font-weight: 500; font-size: 12px; letter-spacing: 0; text-transform: none; color: var(--muted); }
.bossbar { position: absolute; left: 50%; top: 16px; transform: translateX(-50%); width: min(470px, calc(100vw - 590px)); padding: 7px 14px 9px; background: var(--plate);
  border-bottom: 3px solid #ff2e7e; box-shadow: 0 6px 24px rgba(0, 0, 0, 0.35); }
.bossbar .bname { display: flex; align-items: baseline; gap: 10px; margin-bottom: 5px; }
.bossbar .bname b { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: 0.08em; font-size: 16px; color: #ffd2e4; }
.bossbar .bname span { color: var(--muted); font-size: 12px; }
.bossbar .bhp { position: relative; height: 10px; background: rgba(255, 255, 255, 0.12); border-radius: 2px; overflow: hidden; }
.bossbar .bfill { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff2e7e, #ff8ab8); transition: width 0.15s linear; }
.bossbar .bnotch { position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(12, 16, 26, 0.8); }
.bossbar.shielded .bfill { background: linear-gradient(90deg, #c9d3de, #ffffff); }
.bossbar.p2 { border-bottom-color: #ffffff; }
.bossbar .barmor { display: flex; gap: 4px; align-items: center; margin-top: 5px; min-height: 10px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.bossbar .barmor span { margin-right: 4px; }
.bossbar .barmor i { width: 16px; height: 7px; border-radius: 1px; background: rgba(255, 255, 255, 0.14); }
.bossbar .barmor i.on { background: #e6e9f0; }
@media (max-width: 1060px) { .bossbar { top: auto; bottom: 60px; width: min(470px, calc(100vw - 32px)); } }
@keyframes overPulse { from { box-shadow: 0 0 0 0 rgba(255, 241, 201, 0.0); } to { box-shadow: 0 0 10px 2px rgba(255, 241, 201, 0.75); } }
@media (prefers-reduced-motion: reduce) { .chip.over { animation: none; } }

.labels > div { position: absolute; left: 0; top: 0; will-change: transform; }
.pmarker { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.04em; color: var(--pc);
  text-shadow: 0 1px 0 rgba(0,0,0,0.6), 0 0 6px rgba(0,0,0,0.45); white-space: nowrap; }
.bark { max-width: 240px; padding: 6px 10px; border-radius: 8px; background: rgba(250, 252, 255, 0.95); color: #101826; border-left: 4px solid var(--pc); font-size: 14px; line-height: 1.3; }
.bark b { font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 4px; }
.elabel { padding: 3px 9px; border-radius: 4px; background: rgba(10, 18, 34, 0.78); color: var(--text); font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; font-size: 13px; white-space: nowrap; }
.elabel[data-cat=heavy] { color: var(--warm); }
.elabel[data-cat=unblockable] { color: var(--hostile); }
/* Lock-on reticle: four corner brackets in the player's colour, turning slowly, with their tag below */
.reticle { width: var(--rs, 50px); height: var(--rs, 50px); }
.reticle .spin { position: absolute; inset: 0; animation: reticle-spin 3.2s linear infinite; }
.reticle i { position: absolute; width: 30%; height: 30%; border: 3px solid var(--pc); filter: drop-shadow(0 0 2px rgba(0,0,0,0.65)); }
.reticle i:nth-child(1) { left: 0; top: 0; border-right: 0; border-bottom: 0; }
.reticle i:nth-child(2) { right: 0; top: 0; border-left: 0; border-bottom: 0; }
.reticle i:nth-child(3) { left: 0; bottom: 0; border-right: 0; border-top: 0; }
.reticle i:nth-child(4) { right: 0; bottom: 0; border-left: 0; border-top: 0; }
.reticle b { position: absolute; left: 50%; top: 100%; transform: translate(-50%, 3px); font-family: var(--font-display); font-weight: 800; font-size: 12px;
  letter-spacing: 0.04em; color: var(--pc); text-shadow: 0 1px 0 rgba(0,0,0,0.7), 0 0 5px rgba(0,0,0,0.5); white-space: nowrap; }
.reticle.pop .spin { animation: reticle-pop 0.22s ease-out, reticle-spin 3.2s linear infinite; }
@keyframes reticle-spin { to { transform: rotate(360deg); } }
@keyframes reticle-pop { from { transform: scale(1.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.apexlabel { font-family: var(--font-display); font-weight: 800; font-size: 14px; letter-spacing: 0.04em; color: #ffe2a8; white-space: nowrap;
  text-shadow: 0 1px 0 rgba(0,0,0,0.75), 0 0 6px rgba(0,0,0,0.5); }
.apexlabel.perfect { color: #ffffff; }
.chip.lock { color: var(--pc); box-shadow: inset 0 0 0 1px var(--pc); background: rgba(10, 18, 34, 0.35); }
.banner { position: absolute; left: 50%; top: 14%; transform: translateX(-50%) skewX(-8deg); text-align: center; padding: 10px 26px;
  background: var(--plate); border-bottom: 4px solid var(--warm); border-radius: 4px; }
.banner strong { display: block; font-family: var(--font-display); font-weight: 800; text-transform: uppercase; font-size: clamp(26px, 4vw, 40px); letter-spacing: 0.03em; }
.banner span { display: block; color: var(--muted); font-size: 14px; }
.order { position: absolute; left: 50%; bottom: 60px; transform: translateX(-50%); padding: 5px 12px; border-radius: 6px; background: var(--plate); font-size: 13px; color: var(--muted); letter-spacing: 0.02em; }
.order strong { color: var(--text); font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; }
.toast { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 7px 14px; border-radius: 6px; background: var(--plate); font-size: 14px; }
.debug { position: absolute; left: 16px; top: 120px; margin: 0; padding: 8px 10px; max-width: calc(100% - 32px); overflow-x: auto; background: rgba(4, 8, 16, 0.78);
  color: #d7f0ff; font-family: var(--font-mono); font-size: 11px; line-height: 1.45; border-radius: 6px; }
@media (max-width: 640px) {
  .card { padding: 18px 16px; }
  .hud .panel { width: min(200px, 44vw); }
  .pmark { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .bar i { transition: none; } .reticle .spin, .reticle.pop .spin { animation: none; } }
</style>
