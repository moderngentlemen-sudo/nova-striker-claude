# Builds the Unity port of Nova Striker (fresh-start-prototype/unity) for Windows, macOS and Linux with GameCI,
# and uploads each as a zip you can download from the run's page (Summary > Artifacts).
#
# One-time setup: add three repository secrets (Settings > Secrets and variables > Actions):
#   UNITY_EMAIL     the email address of your Unity account
#   UNITY_PASSWORD  its password
#   UNITY_LICENSE   the whole contents of your Unity licence file (Unity_lic.ulf). Unity Hub writes it once you
#                   sign in and activate a licence (the free Personal one is fine):
#                     Windows  C:\ProgramData\Unity\Unity_lic.ulf
#                     macOS    /Library/Application Support/Unity/Unity_lic.ulf
#                     Linux    ~/.local/share/unity3d/Unity/Unity_lic.ulf
#   (With a Pro or Plus licence, add UNITY_SERIAL instead of UNITY_LICENSE.)
#
# It runs on every push that changes the Unity project, and on demand (Actions > Unity build > Run workflow).
name: Unity build

on:
  workflow_dispatch:
  push:
    paths:
      - 'fresh-start-prototype/unity/**'
      - '.github/workflows/unity-build.yml'

concurrency:
  group: unity-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Simulation and asset checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Run deterministic tests and validate exports
        working-directory: fresh-start-prototype/unity
        run: |
          dotnet run --project SimTests/ShieldTests/ShieldTests.csproj
          dotnet run --project SimTests/LevelTests/LevelTests.csproj
          dotnet build SimTests/SimTests.csproj --nologo
          python3 SimTests/validate_assets.py
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, targetPlatform: StandaloneWindows64 }
          - { name: macOS, targetPlatform: StandaloneOSX }
          - { name: Linux, targetPlatform: StandaloneLinux64 }
    env:
      PROJECT: fresh-start-prototype/unity
    steps:
      - name: Check the Unity licence secrets
        id: secrets
        env:
          EMAIL: ${{ secrets.UNITY_EMAIL }}
          PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          LICENSE: ${{ secrets.UNITY_LICENSE }}
          SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$EMAIL" ] || [ -z "$PASSWORD" ] || { [ -z "$LICENSE" ] && [ -z "$SERIAL" ]; }; then
            echo "::error::Unity licence configuration is missing. A skipped player build cannot pass this workflow."
            exit 1
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      # The Unity images are large: make room on the runner first
      - name: Free disk space
        if: steps.secrets.outputs.ok == 'true'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: false
          swap-storage: false

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          lfs: false

      - name: Cache the Library folder
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT }}/Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('fresh-start-prototype/unity/Packages/manifest.json', 'fresh-start-prototype/unity/ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      # First Unity run: set the project up (materials, pipeline, scene, the Input System backend) and quit. The
      # input backend only takes effect when Unity starts, so the build has to be a second run.
      - name: Prepare the project with Unity
        if: steps.secrets.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.PROJECT }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: NovaStriker
          buildsPath: prepare
          buildMethod: NovaStriker.EditorTools.NovaSetup.PrepareForBuild
          manualExit: true
          versioning: None
          allowDirtyBuild: true
          chownFilesTo: '1001:1001'

      - name: Build with Unity
        if: steps.secrets.outputs.ok == 'true'
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: ${{ env.PROJECT }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: NovaStriker
          buildsPath: build
          buildMethod: NovaStriker.EditorTools.NovaBuild.Build
          manualExit: true
          versioning: None
          allowDirtyBuild: true
          chownFilesTo: '1001:1001'

      # Zipped here rather than by the artifact upload, so the macOS app and the Linux binary keep their
      # executable permissions
      - name: Zip the build
        if: steps.secrets.outputs.ok == 'true'
        run: |
          cd build/${{ matrix.targetPlatform }}
          zip -q -r -y "$GITHUB_WORKSPACE/NovaStriker-${{ matrix.name }}.zip" .
          ls -la "$GITHUB_WORKSPACE/NovaStriker-${{ matrix.name }}.zip"

      - name: Upload
        if: steps.secrets.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NovaStriker-${{ matrix.name }}
          path: NovaStriker-${{ matrix.name }}.zip
          retention-days: 30
          compression-level: 0

      - name: Capture Linux player review
        if: matrix.name == 'Linux' && steps.secrets.outputs.ok == 'true'
        timeout-minutes: 12
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 ffmpeg
          mkdir -p review
          player=$(find build/StandaloneLinux64 -name '*.x86_64' -type f -print -quit)
          test -n "$player"
          chmod +x "$player"
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s '-screen 0 960x540x24' timeout 600s "$player" \
            -force-glcore -screen-fullscreen 0 -screen-width 960 -screen-height 540 \
            -logFile "$GITHUB_WORKSPACE/review/player.log" \
            --nova-review "$GITHUB_WORKSPACE/review" --nova-commit "$GITHUB_SHA"
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('review/runtime.json').read_text())
          log=Path('review/player.log').read_text(errors='replace')
          assert not any(s in log for s in ('GLSL compilation failed', 'ShaderProgram is unsupported', 'Shader error in')), 'Player shader compilation failed'
          assert not r['errors'], r['errors']
          assert len(r['captures']) == 35, r['captures']
          assert all(name in r['captures'] for name in ['nova_beam_charge','nova_beam_release','ram_beam_charge','ram_beam_release','chain_lightning','electrified_enemies']), r['captures']
          assert r['particles'] <= r['particleCap'], r
          print('Player review:',r['unity'],r['gpu'],len(r['captures']),'captures')
          PY
          ffmpeg -hide_banner -loglevel warning -y -framerate 10 -i review/motion/%03d.png -c:v libx264 -pix_fmt yuv420p review/skyline-motion.mp4
      - name: Upload player review evidence
        if: always() && matrix.name == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: NovaStriker-Linux-review
          path: review/
          if-no-files-found: warn
          retention-days: 30
